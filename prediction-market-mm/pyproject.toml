[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "prediction-market-mm"
version = "0.1.0"
description = "Market-making and microstructure research on prediction markets (Kalshi/Polymarket)."
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]
